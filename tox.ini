[tox]
envlist = py36, py37

[testenv]
deps=
	pytest
	coverage
commands=
    coverage run --source=electrum_btcz '--omit=electrum_btcz/gui/*,electrum_btcz/plugins/*,electrum_btcz/scripts/*,electrum_btcz/tests/*' -m py.test -v
	coverage report
extras=
	tests

[gh-actions]
python =
    3.6: py36
    3.7: py37
